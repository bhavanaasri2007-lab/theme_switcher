
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch the Vibe ✨</title>

<style>
:root {
    --bg: #fff3ec;
    --text: #302544;
    --muted: #82758e;
    --card: rgba(255,255,255,.72);
    --border: rgba(255,255,255,.85);
    --accent: #ff9a9e;
    --glow: rgba(255,145,130,.24);
    --track: linear-gradient(120deg,#ffd36f,#ff9dc1);
    --orb1: #ffe99c;
    --orb2: #ff9eae;
}

body.dark {
    --bg: #080d21;
    --text: #f7f2ff;
    --muted: #b1b4d3;
    --card: rgba(19,25,55,.78);
    --border: rgba(174,164,255,.2);
    --accent: #b6a1ff;
    --glow: rgba(133,100,255,.24);
    --track: linear-gradient(120deg,#414c99,#a16cf4);
    --orb1: #6878ce;
    --orb2: #252b65;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 30px 16px;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 10% 15%,var(--glow),transparent 45%),
        radial-gradient(ellipse at 90% 85%,var(--glow),transparent 42%),
        var(--bg);
    transition: background-color .7s, color .6s;
    position: relative;
    isolation: isolate;
}

/* Cursor-following glow */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background: radial-gradient(
        300px circle at var(--mx,50%) var(--my,50%),
        var(--glow), transparent 75%
    );
}

/* Floating background auroras */

.aurora {
    position: fixed;
    z-index: -2;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    filter: blur(75px);
    opacity: .35;
    pointer-events: none;
    background: #ffb4b9;
    animation: drift 12s ease-in-out infinite alternate;
}

.aurora.one {
    top: -120px;
    left: -100px;
}

.aurora.two {
    bottom: -130px;
    right: -90px;
    background: #a99aff;
    animation-delay: -5s;
}

body.dark .aurora {
    opacity: .4;
}

/* Starry night */

.stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    transition: opacity .8s;
}

body.dark .stars {
    opacity: 1;
}

.star {
    position: absolute;
    color: #fff3b5;
    animation: twinkle var(--duration,3s) ease-in-out infinite alternate;
    animation-delay: var(--delay,0s);
}

/* Rainbow scene */

.rainbow-scene {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    opacity: 1;
    transition: opacity .8s;
}

body.dark .rainbow-scene {
    opacity: 0;
}

.rainbow {
    position: absolute;
    width: min(1050px,140vw);
    height: min(1050px,140vw);
    left: 50%;
    top: 48%;
    border-radius: 50%;
    transform: translate(-50%,0) scale(.12);
    transform-origin: center center;

    background: conic-gradient(
        from 270deg at 50% 50%,
        transparent 0deg 45deg,
        #d81515 45deg 50deg,
        #ff9238 50deg 55deg,
        #ffe34d 55deg 60deg,
        #53d66b 60deg 65deg,
        #39c9f4 65deg 70deg,
        #6675ff 70deg 75deg,
        #bd63f5 75deg 80deg,
        transparent 80deg 360deg
    );

    -webkit-mask: radial-gradient(
        circle,
        transparent 0 58%,
        #000 59% 66%,
        transparent 67%
    );
    mask: radial-gradient(
        circle,
        transparent 0 58%,
        #000 59% 66%,
        transparent 67%
    );

    opacity: 0;
    animation: rainbowAppear 2.5s ease-out .4s forwards;
}

.rainbow-glow {
    position: absolute;
    left: 50%;
    top: 49%;
    width: min(1050px,140vw);
    height: min(1050px,140vw);
    border-radius: 50%;
    transform: translate(-50%,0);

    background: conic-gradient(
        from 270deg,
        transparent 0deg 45deg,
        #ff606030 45deg 50deg,
        #ffbd3030 50deg 55deg,
        #fff34a30 55deg 60deg,
        #54ff8830 60deg 65deg,
        #48dcff30 65deg 70deg,
        #7777ff30 70deg 75deg,
        #dc75ff30 75deg 80deg,
        transparent 80deg 360deg
    );

    filter: blur(25px);
    opacity: 0;
    animation:
        rainbowAppear 3s ease-out .5s forwards,
        rainbowShimmer 5s ease-in-out 3.5s infinite alternate;
}

@keyframes rainbowAppear {
    0% {
        opacity: 0;
        transform: translate(-50%,0) scale(.12);
    }
    65% {
        opacity: .85;
    }
    100% {
        opacity: .65;
        transform: translate(-50%,0) scale(1);
    }
}

@keyframes rainbowShimmer {
    from {
        filter: blur(20px);
        opacity: .35;
    }
    to {
        filter: blur(32px);
        opacity: .75;
    }
}

/* Comet scene */

.comet-scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity .6s;
}

body.dark .comet-scene {
    opacity: 1;
}

.comet {
    position: absolute;
    top: 10%;
    left: -220px;
    width: 190px;
    height: 5px;
    opacity: 0;
    transform: rotate(-24deg);
    animation: cometFlight 6s linear 1s infinite;
}

.comet-head {
    position: absolute;
    right: 0;
    top: -4px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
        0 0 8px #fff,
        0 0 18px #8be8ff,
        0 0 35px #8b9dff;
}

.comet-tail {
    position: absolute;
    right: 7px;
    top: 0;
    width: 183px;
    height: 4px;
    border-radius: 50%;
    background: linear-gradient(
        90deg,
        transparent,
        #777aff22,
        #79cfff,
        #fff
    );
    filter: blur(1px);
}

@keyframes cometFlight {
    0% {
        left: -220px;
        top: 8%;
        opacity: 0;
    }
    8% {
        opacity: 1;
    }
    75% {
        opacity: 1;
    }
    100% {
        left: calc(100% + 220px);
        top: 70%;
        opacity: 0;
    }
}

/* Main glass card */

.container {
    width: min(100%,530px);
    padding: 36px 30px 27px;
    text-align: center;
    position: relative;
    z-index: 2;
    border: 1px solid var(--border);
    border-radius: 32px;
    background: var(--card);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 25px 80px var(--glow);
    animation: entrance .9s cubic-bezier(.2,.8,.2,1) both;
    transition: background .6s,border-color .6s,box-shadow .6s;
}

/* Decorative border without mask-composite */

.container::before {
    content: "";
    position: absolute;
    inset: -1px;
    padding: 1px;
    border-radius: inherit;
    border: 1px solid rgba(180,150,255,.35);
    pointer-events: none;
}

.badge {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    padding: 9px 14px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 30px;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 800;
    margin-bottom: 22px;
}

.pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #52dca5;
    box-shadow: 0 0 12px #52dca5;
    animation: pulse 1.8s infinite;
}

h1 {
    font-size: clamp(34px,8vw,49px);
    letter-spacing: -2px;
    line-height: 1.1;
    margin-bottom: 13px;
}

.gradient-text {
    background: linear-gradient(100deg,#ff8b83,#b38bff,#ff9dc5);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientFlow 5s linear infinite;
}

.subtitle {
    max-width: 340px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}

/* Sun and moon universe */

.universe {
    height: 225px;
    display: grid;
    place-items: center;
    position: relative;
    margin: 8px auto 0;
}

.orbit {
    position: absolute;
    width: 190px;
    height: 190px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    opacity: .4;
    animation: rotate 18s linear infinite;
}

.orbit.two {
    width: 218px;
    height: 142px;
    transform: rotate(-35deg);
    animation-duration: 14s;
    animation-direction: reverse;
}

.planet {
    position: absolute;
    top: 7px;
    left: 32px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #ffb1a0;
    box-shadow: 0 0 17px #ffb1a0;
}

.orbit.two .planet {
    top: auto;
    left: auto;
    right: 25px;
    bottom: 7px;
    width: 10px;
    height: 10px;
    background: #a995ff;
    box-shadow: 0 0 17px #a995ff;
}

.orb {
    width: 136px;
    height: 136px;
    display: grid;
    place-items: center;
    position: relative;
    border-radius: 50%;
    background: linear-gradient(145deg,var(--orb1),var(--orb2));
    box-shadow: 0 0 0 12px var(--glow),0 0 60px var(--glow);
    animation: float 4s ease-in-out infinite;
    transition: background .8s,box-shadow .8s;
}

.orb-icon {
    font-size: 72px;
    display: inline-block;
    filter: drop-shadow(0 5px 9px #30234720);
    animation: iconBreathe 3s ease-in-out infinite;
    transition: transform .7s,filter .7s;
}

body.dark .orb-icon {
    transform: rotate(-15deg);
    filter: drop-shadow(0 0 15px #b5b6ff88);
}

.sparkle {
    position: absolute;
    font-size: 22px;
    color: var(--accent);
    animation: sparkle 3s ease-in-out infinite;
}

.sparkle.s1 { top: 35px; left: 50px; }
.sparkle.s2 { bottom: 42px; right: 48px; animation-delay: -1.5s; }
.sparkle.s3 { top: 52px; right: 56px; font-size: 14px; animation-delay: -.8s; }

/* Theme toggle */

.toggle-title {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: var(--muted);
    margin-bottom: 15px;
}

.toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    width: 154px;
    height: 66px;
    padding: 7px;
    margin: 0 auto 17px;
    border: 1px solid var(--border);
    border-radius: 50px;
    background: var(--track);
    box-shadow: 0 8px 28px var(--glow);
    cursor: pointer;
    transition: background .6s,box-shadow .6s;
    -webkit-tap-highlight-color: transparent;
}

.toggle:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 5px;
}

.symbol {
    width: 49px;
    z-index: 1;
    font-size: 25px;
    user-select: none;
    pointer-events: none;
}

.knob {
    position: absolute;
    top: 7px;
    left: 7px;
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 14px #27204430;
    font-size: 23px;
    transition: transform .65s cubic-bezier(.34,1.56,.64,1);
}

body.dark .knob {
    transform: translateX(88px);
}

.toggle:active .knob {
    scale: .9;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 11px 16px;
    margin-bottom: 28px;
    border: 1px solid var(--border);
    border-radius: 40px;
    background: var(--card);
    font-size: 12px;
    font-weight: 700;
    transition: background .5s;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f4a85c;
    box-shadow: 0 0 10px #f4a85c;
}

body.dark .status-dot {
    background: #a996ff;
    box-shadow: 0 0 10px #a996ff;
}

/* Feature cards */

.features {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 11px;
}

.feature {
    padding: 17px 7px 15px;
    border: 1px solid var(--border);
    border-radius: 19px;
    background: var(--card);
    transition: transform .35s,background .5s,border-color .35s,box-shadow .35s;
    animation: entrance .8s both;
}

.feature:nth-child(2) { animation-delay: .12s; }
.feature:nth-child(3) { animation-delay: .24s; }

.feature:hover {
    transform: translateY(-7px) scale(1.035);
    border-color: var(--accent);
    box-shadow: 0 12px 28px var(--glow);
}

.feature-icon {
    display: block;
    font-size: 27px;
    margin-bottom: 10px;
    transition: transform .4s;
}

.feature:hover .feature-icon {
    transform: rotate(-10deg) scale(1.18);
}

.feature h3 {
    font-size: 11px;
    margin-bottom: 7px;
}

.feature p {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.5;
}

footer {
    margin-top: 27px;
    font-size: 11px;
    color: var(--muted);
}

footer span { color: var(--accent); }

.hint {
    margin-top: 9px;
    font-size: 10px;
    color: var(--muted);
    opacity: .8;
}

/* Animations */

@keyframes entrance {
    from { opacity: 0; transform: translateY(25px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

@keyframes iconBreathe {
    0%,100% { scale: 1; }
    50% { scale: 1.07; }
}

@keyframes rotate {
    to { rotate: 360deg; }
}

@keyframes twinkle {
    from { opacity: .15; scale: .65; }
    to { opacity: 1; scale: 1.25; }
}

@keyframes sparkle {
    0%,100% { opacity: .4; scale: .7; rotate: 0deg; }
    50% { opacity: 1; scale: 1.2; rotate: 20deg; }
}

@keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 #52dca555; }
    50% { box-shadow: 0 0 0 6px #52dca500; }
}

@keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(70px,50px) scale(1.2); }
}

@keyframes gradientFlow {
    to { background-position: 200% center; }
}

/* Mobile responsive */

@media (max-width: 420px) {
    .container { padding: 30px 17px 23px; }
    .universe { height: 210px; }
    .features { gap: 6px; }
    .feature { padding: 14px 4px; }
    .feature h3 { font-size: 10px; }
    .feature p { font-size: 9px; }
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }

    .rainbow {
        opacity: .65;
        transform: translate(-50%,0) scale(1);
    }

    .rainbow-glow { opacity: .35; }
}
</style>
</head>

<body>

<div class="aurora one"></div>
<div class="aurora two"></div>
<div class="stars" id="stars" aria-hidden="true"></div>

<div class="rainbow-scene" aria-hidden="true">
    <div class="rainbow"></div>
    <div class="rainbow-glow"></div>
</div>

<div class="comet-scene" aria-hidden="true">
    <div class="comet">
        <div class="comet-head"></div>
        <div class="comet-tail"></div>
    </div>
</div>

<main class="container">

    <div class="badge">
        <span class="pulse"></span>
        YOUR PERSONAL UNIVERSE
    </div>

    <h1>Switch the <span class="gradient-text">Vibe.</span></h1>

    <p class="subtitle">
        Choose the mood that feels like you.<br>
    </p>

    <div class="universe" aria-hidden="true">
        <div class="orbit">
            <span class="planet"></span>
        </div>

        <div class="orbit two">
            <span class="planet"></span>
        </div>

        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span>

        <div class="orb">
            <span class="orb-icon" id="orbIcon">☀️</span>
        </div>
    </div>

    <p class="toggle-title">CHOOSE YOUR UNIVERSE</p>

    <button
        class="toggle"
        id="themeToggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false">

        <span class="symbol" aria-hidden="true">☀️</span>
        <span class="symbol" aria-hidden="true">🌙</span>
        <span class="knob" id="knob" aria-hidden="true">☀️</span>
    </button>

    <div class="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">☀️ Light universe activated</span>
    </div>

    <section class="features" aria-label="Theme features">

        <article class="feature">
            <span class="feature-icon">🌈</span>
            <h3>Color Magic</h3>
            <p>A bright day theme</p>
        </article>

        <article class="feature">
            <span class="feature-icon">☄️</span>
            <h3>Night</h3>
            <p>Watch the skies move</p>
        </article>

    </section>

    <footer>
        Crafted with <span>♥</span> and a little animated magic
    </footer>

    <p class="hint">Try the switch. Watch your universe change ✨</p>

</main>

<script>
const toggle = document.getElementById("themeToggle");
const orbIcon = document.getElementById("orbIcon");
const knob = document.getElementById("knob");
const statusText = document.getElementById("statusText");
const stars = document.getElementById("stars");
const rainbow = document.querySelector(".rainbow");
const rainbowGlow = document.querySelector(".rainbow-glow");
const comet = document.querySelector(".comet");

// Create the animated stars
for (let i = 0; i < 65; i++) {
    const star = document.createElement("span");

    star.className = "star";
    star.textContent = Math.random() > 0.5 ? "✦" : "·";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.fontSize = (Math.random() * 12 + 5) + "px";

    star.style.setProperty(
        "--duration",
        (2 + Math.random() * 3) + "s"
    );

    star.style.setProperty(
        "--delay",
        (-Math.random() * 4) + "s"
    );

    stars.appendChild(star);
}

// Restart a CSS animation
function restartAnimation(element) {
    if (!element) return;

    element.style.animation = "none";
    void element.offsetWidth;
    element.style.animation = "";
}

// Apply a theme and optionally save it
function applyTheme(theme, save = true) {
    const isDark = theme === "dark";

    document.body.classList.toggle("dark", isDark);

    orbIcon.textContent = isDark ? "🌙" : "☀️";
    knob.textContent = isDark ? "🌙" : "☀️";

    statusText.textContent = isDark
        ? "🌙 Dark universe activated"
        : "☀️ Light universe activated";

    toggle.setAttribute("aria-pressed", String(isDark));

    toggle.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
    );

    // Restart the scene animation when switching themes
    if (isDark) {
        restartAnimation(comet);
    } else {
        restartAnimation(rainbow);
        restartAnimation(rainbowGlow);
    }

    // Remember the selected theme
    if (save) {
        try {
            localStorage.setItem("theme", theme);
        } catch (error) {
            console.warn("Theme preference could not be saved.", error);
        }
    }
}

// Load the previously saved theme
let initialTheme = "light";

try {
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark" || savedTheme === "light") {
        initialTheme = savedTheme;
    }
} catch (error) {
    console.warn("Could not read the saved theme.", error);
}

applyTheme(initialTheme, false);

// Switch themes on click
toggle.addEventListener("click", () => {
    const isDark = document.body.classList.contains("dark");

    applyTheme(isDark ? "light" : "dark");
});

// Mouse-following background glow
document.addEventListener("pointermove", (event) => {
    if (event.pointerType === "touch") return;

    document.body.style.setProperty("--mx", event.clientX + "px");
    document.body.style.setProperty("--my", event.clientY + "px");
});
</script>

</body>
</html>
